*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B0B0B;color:#F4F4F2;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;padding:20px}
.box{width:100%;max-width:380px}

.sub{color:#A3A3A0;font-size:14px;margin:0 0 26px}

.foot{color:#A3A3A0;font-size:12px;margin-top:22px;line-height:1.5}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(dni, code){
  dni = dni.replace(/\D/g,'').padStart(8,'0');
  code = code.trim().toUpperCase();
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(dni+'|'+code), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(P.s), iterations:P.i, hash:'SHA-256'}, base, 512));
  const tag = btoa(String.fromCharCode.apply(null, bits.slice(32,40)));
  const w = P.w.find(x => x.t === tag);
  if(!w) throw new Error('no');
  const kek = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['decrypt']);
  const K = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(w.v)}, kek, b64(w.c));
  const dk = await crypto.subtle.importKey('raw', K, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.v)}, dk, b64(P.d)));
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Verificando…';
  try { await abrir(document.getElementById('dni').value, document.getElementById('cod').value); }
  catch(_) { err.textContent = 'DNI o código incorrecto.'; btn.disabled = false; btn.textContent = 'Entrar'; }
});
